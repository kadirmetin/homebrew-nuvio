name: Update Nuvio

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  workflow_dispatch:
    inputs:
      force:
        description: "Run the update job even if the version is unchanged (for testing)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-nuvio
  cancel-in-progress: false

jobs:
  # Cheap check on Linux; the macOS job only runs when there is a new version.
  check:
    runs-on: ubuntu-latest
    outputs:
      updated: ${{ steps.check.outputs.updated }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Check latest NuvioDesktop release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ inputs.force || false }}
        run: |
          set -euo pipefail
          CASK=Casks/nuvio.rb

          release=$(gh api repos/NuvioMedia/NuvioDesktop/releases/latest)
          latest=$(jq -r .tag_name <<<"$release")
          current=$(sed -nE 's/^[[:space:]]*version "([^"]+)".*/\1/p' "$CASK")
          echo "current=$current latest=$latest"

          if [ -z "$latest" ] || [ "$latest" = "null" ]; then
            echo "Could not read latest tag"; exit 1
          fi
          if [ "$latest" = "$current" ] && [ "$FORCE" != "true" ]; then
            echo "Already up to date"; echo "updated=false" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # Make sure both macOS DMGs are uploaded before bumping
          for arch in arm64 x86_64; do
            asset="Nuvio-macOS-${arch}-${latest}.dmg"
            if ! jq -e --arg n "$asset" '.assets[] | select(.name == $n)' <<<"$release" >/dev/null; then
              echo "Asset $asset not found yet, skipping this run"
              echo "updated=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
          done

          echo "updated=true" >> "$GITHUB_OUTPUT"
          echo "version=$latest" >> "$GITHUB_OUTPUT"

  update:
    needs: check
    if: needs.check.outputs.updated == 'true'
    runs-on: macos-latest
    steps:
      # Checks out this repo as a Homebrew tap (and trusts it)
      - name: Set up Homebrew
        id: brew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Bump version and checksums
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          CASK=Casks/nuvio.rb
          base="https://github.com/NuvioMedia/NuvioDesktop/releases/download/${VERSION}"

          curl -fsSL -o arm64.dmg "${base}/Nuvio-macOS-arm64-${VERSION}.dmg"
          curl -fsSL -o x86_64.dmg "${base}/Nuvio-macOS-x86_64-${VERSION}.dmg"
          export SHA_ARM=$(shasum -a 256 arm64.dmg | cut -d' ' -f1)
          export SHA_INTEL=$(shasum -a 256 x86_64.dmg | cut -d' ' -f1)
          rm -f arm64.dmg x86_64.dmg
          echo "arm64=$SHA_ARM x86_64=$SHA_INTEL"

          perl -pi -e 's/^(\s*version ")[^"]+(")/$1$ENV{VERSION}$2/' "$CASK"
          perl -pi -e 's/(arm:\s+")[0-9a-f]{64}(")/$1$ENV{SHA_ARM}$2/' "$CASK"
          perl -pi -e 's/(intel:\s+")[0-9a-f]{64}(")/$1$ENV{SHA_INTEL}$2/' "$CASK"

          # Fail if any of the replacements didn't land
          grep -q "version \"${VERSION}\"" "$CASK"
          grep -q "\"${SHA_ARM}\"" "$CASK"
          grep -q "\"${SHA_INTEL}\"" "$CASK"
          git diff

      # If this fails, nothing is committed and users stay on the last working version
      - name: Audit cask
        run: |
          brew style Casks/nuvio.rb
          brew audit --cask --strict --online "${{ steps.brew.outputs.tap-name }}/nuvio"

      - name: Commit and push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes to commit"; exit 0
          fi
          git add Casks/nuvio.rb
          git commit -m "Update Nuvio version to ${{ needs.check.outputs.version }}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:main
